<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chequeo Médico</title>

  <!-- Quill Editor -->
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet" />
  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>

  <!-- Signature Pad -->
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <!-- Estilos propios -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div id="app">
    <!-- Barra lateral -->
    <nav id="sidebar">
      <div id="sidebar-header">
        <h2>Chequeo Médico</h2>
        <p id="patient-name-display">Sin paciente</p>
        <div id="db-status" class="db-status db-connecting">● Conectando...</div>
      </div>

      <div id="sidebar-db">
        <div id="db-actions">
          <button onclick="dbNewRecord()" class="btn-db btn-db-new">＋ Nuevo paciente</button>
          <button onclick="dbSaveRecord()" class="btn-db btn-db-save">💾 Guardar en BD</button>
          <button onclick="togglePatientList()" class="btn-db btn-db-list">📋 Pacientes guardados</button>
        </div>
        <div id="patient-list-panel" style="display:none;">
          <div id="patient-list-search">
            <input type="text" id="patient-search-input" placeholder="Buscar paciente..." oninput="filterPatients()" />
          </div>
          <ul id="patient-list"></ul>
        </div>
      </div>

      <ul id="sheet-nav"></ul>

      <div id="sidebar-actions">
        <button onclick="printReport()" class="btn-action">🖨 Imprimir / PDF</button>
        <button onclick="saveData()" class="btn-action">⬇ Exportar JSON</button>
        <button onclick="loadData()" class="btn-action">⬆ Importar JSON</button>
      </div>
    </nav>

    <!-- Área principal -->
    <main id="main-content">
      <div id="sheet-container"></div>
    </main>
  </div>

  <script src="js/sheets/sheet1.js"></script>
  <script src="js/sheets/sheet2.js"></script>
  <script src="js/sheets/sheet3.js"></script>
  <script src="js/sheets/sheet4.js"></script>
  <script src="js/sheets/sheet5.js"></script>
  <script src="js/sheets/sheet6.js"></script>
  <script src="js/sheets/sheet7.js"></script>
  <script src="js/sheets/sheet8.js"></script>
  <script src="js/sheets/sheet9.js"></script>
  <script src="js/sheets/sheet10.js"></script>
  <script src="js/sheets/sheet11.js"></script>
  <script src="js/sheets/sheet12.js"></script>
  <script src="js/sheets/sheet13.js"></script>
  <script src="js/sheets/sheet14.js"></script>
  <script src="js/sheets/sheet15.js"></script>
  <script src="js/sheets/sheet16.js"></script>
  <script src="js/sheets/sheet17.js"></script>
  <script src="js/sheets/sheet18.js"></script>
  <script src="js/sheets/sheet19.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
